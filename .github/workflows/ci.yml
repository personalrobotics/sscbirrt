name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Eigen; Mesa's EGL so MuJoCo renders the demos without a display)
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Install dependencies (builds the extension; ssik is a build requirement, so the SSIK adapter is detected)
        run: |
          uv sync --all-extras --dev
          uv run python -c "import sscbirrt._native as n; assert n.has_ssik(), n.ssik_unavailable_reason(); print('native SSIK adapter built')"
          uv run python -c "from sscbirrt.backends import native_mujoco as m; assert m.available(), m.unavailable_reason(); print('native MuJoCo scene built')"

      - name: Point the UR5e tests at the packaged models, and require headless rendering to work
        run: |
          echo "MUJOCO_MENAGERIE_PATH=$(uv run python -c 'import sscbirrt_assets; print(sscbirrt_assets.menagerie_path())')" >> "$GITHUB_ENV"
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
          echo "SSCBIRRT_REQUIRE_RENDER=1" >> "$GITHUB_ENV"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            uv run pytest tests/ -v
          else
            echo "No tests/ directory; skipping pytest."
          fi

  assets:
    name: sscbirrt-assets wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Build (the build hook fetches and hash-checks the pinned menagerie files)
        run: uv build assets --out-dir "$RUNNER_TEMP/assets-dist"
      - name: The installed wheel matches the manifest and both models compile
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/assets-env"
          uv pip install --python "$RUNNER_TEMP/assets-env/bin/python" "$RUNNER_TEMP"/assets-dist/*.whl "mujoco==3.14.0"
          "$RUNNER_TEMP/assets-env/bin/python" assets/verify.py

  cpp:
    name: C++ core (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install Eigen, the ssik headers (for the SSIK adapter under sanitizers), and sstsr's C++ core
        run: |
          sudo apt-get update && sudo apt-get install -y libeigen3-dev
          uv venv "$RUNNER_TEMP/ssik-env"
          uv pip install --python "$RUNNER_TEMP/ssik-env/bin/python" "ssik>=8.2,<9" "sstsr>=3.3,<4"
          echo "SSIK_CMAKE_DIR=$("$RUNNER_TEMP/ssik-env/bin/python" -c 'import ssik; print(ssik.get_cmake_dir())')" >> "$GITHUB_ENV"
          echo "SSTSR_CMAKE_DIR=$("$RUNNER_TEMP/ssik-env/bin/python" -c 'import tsr; print(tsr.get_cmake_dir())')" >> "$GITHUB_ENV"
          uv pip install --python "$RUNNER_TEMP/ssik-env/bin/python" "mujoco==3.14.0"
          echo "MUJOCO_DIR=$("$RUNNER_TEMP/ssik-env/bin/python" -c 'import mujoco, os; print(os.path.dirname(mujoco.__file__))')" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DSSCBIRRT_SANITIZE=ON -DSSCBIRRT_WITH_SSIK=ON -DSSCBIRRT_SSIK_CMAKE_DIR="$SSIK_CMAKE_DIR" -DSSCBIRRT_SSTSR_CMAKE_DIR="$SSTSR_CMAKE_DIR" -DSSCBIRRT_WITH_MUJOCO=ON -DSSCBIRRT_MUJOCO_DIR="$MUJOCO_DIR"
      - name: Build
        run: cmake --build build/cpp --parallel
      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure

  cpp-consumer:
    name: C++ consumer (installed package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install sstsr's C++ core (a dependency of the installed package)
        run: |
          uv venv "$RUNNER_TEMP/sstsr-env"
          uv pip install --python "$RUNNER_TEMP/sstsr-env/bin/python" "sstsr>=3.3,<4"
          echo "SSTSR_CMAKE_DIR=$("$RUNNER_TEMP/sstsr-env/bin/python" -c 'import tsr; print(tsr.get_cmake_dir())')" >> "$GITHUB_ENV"
      - name: Install, then build and run the standalone consumer against the installed package
        run: cpp/examples/consumer/smoke.sh "$RUNNER_TEMP/sscbirrt"

  package:
    name: Wheel and sdist in clean environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install Eigen (ssik, a build requirement, supplies the ssik_cpp headers to the isolated build)
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Build the wheel and the sdist
        run: uv build
      - name: Install the wheel into a fresh environment and plan natively
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -c "
          import sscbirrt._native as n; assert n.has_ssik(), n.ssik_unavailable_reason()
          import numpy as np
          from sscbirrt import CBiRRT, CBiRRTConfig, FiniteSet, PlanningProblem
          from sscbirrt.testing import NoCollision, PlanarArm, PlanarIK
          p = CBiRRT(PlanarArm(), PlanarIK(), NoCollision(), CBiRRTConfig(step_size=0.2), backend='native')
          f = lambda qs: FiniteSet(qs, tolerance=1e-3, metric=p.space.distance)
          r = p.solve(PlanningProblem(space=p.space, start=f([np.zeros(2)]), goal=f([np.array([1.0, 0.5])]), validator=p.collision), seed=0)
          assert r.success and r.backend == 'native', r
          print('wheel ok:', len(r.path), 'waypoints natively')
          "
      - name: Without mujoco installed, sscbirrt imports and the MuJoCo scene reports its reason
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -c "
          import sscbirrt
          from sscbirrt.backends import native_mujoco as m
          assert not m.available() and 'mujoco is not installed' in m.unavailable_reason(), m.unavailable_reason()
          print('no-mujoco import ok:', m.unavailable_reason())
          "
      - name: With the mujoco extra, the native scene loads against the pinned MuJoCo
        run: |
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "$(ls dist/*.whl)[mujoco]"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "
          import mujoco
          from sscbirrt.backends import native_mujoco as m
          assert m.available(), m.unavailable_reason()
          model = mujoco.MjModel.from_xml_string('<mujoco><worldbody><body><joint name=\"j\" type=\"hinge\"/><geom size=\"0.1\"/></body></worldbody></mujoco>')
          s = m.NativeScene.from_model(model, ['j']); print('scene ok:', s.provenance)
          "
      - name: Install the sdist into a fresh environment (compiles from source)
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdist-env"
          uv pip install --python "$RUNNER_TEMP/sdist-env/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/python" -c "import sscbirrt._native as n; print('sdist ok; ssik adapter:', n.has_ssik())"

  package-macos:
    name: Wheel on macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install Eigen
        run: brew install eigen
      - name: Build the wheel (ssik and mujoco are build requirements; both native adapters must be present)
        run: uv build --wheel
      - name: Install into a fresh environment with every extra and exercise every native module
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/mac-env"
          uv pip install --python "$RUNNER_TEMP/mac-env/bin/python" "$(ls dist/*.whl)[ssik,mujoco]"
          "$RUNNER_TEMP/mac-env/bin/python" -c "
          import mujoco, numpy as np
          import sscbirrt._native as n; assert n.has_ssik(), n.ssik_unavailable_reason()
          from sscbirrt.backends import native_mujoco as m; assert m.available(), m.unavailable_reason()
          model = mujoco.MjModel.from_xml_string('<mujoco><worldbody><body><joint name=\"j\" type=\"hinge\"/><geom size=\"0.1\"/></body></worldbody></mujoco>')
          s = m.NativeScene.from_model(model, ['j']); print('macOS wheel: ssik and mujoco native modules ok', s.provenance['mujoco'])
          "
          "$RUNNER_TEMP/mac-env/bin/python" tools/reference_artifact.py --backend native --check
          "$RUNNER_TEMP/mac-env/bin/python" tools/reference_artifact.py --backend auto --check

  notify-robot-code:
    needs: [test, assets, cpp, cpp-consumer, package, package-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Surface the token to step-level `if` (the `secrets` context isn't available
    # in `if` directly). When it's unset, skip the dispatch with a visible notice
    # rather than failing an otherwise-green run. A real dispatch failure with a
    # configured token still surfaces.
    env:
      DISPATCH_TOKEN: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch integration run
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
      - name: Skip downstream dispatch (no token configured)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::ROBOT_CODE_DISPATCH_TOKEN not configured; skipping downstream dispatch. Package checks passed."
