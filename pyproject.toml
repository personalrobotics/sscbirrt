[project]
name = "sscbirrt"
version = "3.3.0"
description = "CBiRRT: a motion planner over sets of starts, goals, and path constraints, with a C++ core and Task Space Regions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["motion-planning", "cbirrt", "rrt", "task-space-regions", "tsr", "manipulation", "robotics", "mujoco"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = [
    "numpy>=1.24",
    "sstsr>=3.3,<4",  # import as `tsr`; 3.3 ships the C++ core (TSRs and chains) the native backend is built on (#184)
]

[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]  # exact: sscbirrt._native_mujoco is built against this MuJoCo and refuses another (docs/native-design.md, v1.7.0)
ssik = ["ssik>=7.0,<8"]  # 7.0 ships the ssik_cpp headers and ssik.cpp.joint_data for the native SSIK adapter (ssik#641)
# `sscbirrt-demo`: rendered MuJoCo scenarios. The robot models come from the sscbirrt-assets data wheel;
# imageio[ffmpeg] brings its own ffmpeg binary, so no system package is needed.
demo = [
    "sscbirrt[mujoco,ssik]",
    "sscbirrt-assets>=1,<2",
    "imageio[ffmpeg]>=2.30",
    "pillow>=10.1",  # ImageFont.load_default(size=) for the overlay text
]
examples = [
    "matplotlib",  # the planar example's plots; the MuJoCo examples are the demos (sscbirrt[demo])
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.15,<0.16",  # formatter style only changes in minor releases; bump deliberately
    "hypothesis>=6.100",
]
all = ["sscbirrt[mujoco,ssik,demo,examples,dev]"]

[project.scripts]
sscbirrt-demo = "sscbirrt.demo.__main__:main"

# Develop against the in-repo asset package (assets/, built by its hook from the pinned menagerie).
[tool.uv.sources]
sscbirrt-assets = { path = "assets" }

[build-system]
# ssik is a build requirement so the isolated build can ask it for the ssik_cpp CMake package
# (SSCBIRRT_WITH_SSIK=AUTO); without it the extension builds with the adapter disabled. sstsr is one because the native
# pose regions are its C++ core, found through tsr.get_cmake_dir() (#184); find_package pins no version.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "ssik>=7.0,<8", "mujoco==3.14.0", "sstsr>=3.3,<4"]
build-backend = "scikit_build_core.build"

# The C++ core under cpp/ is the primary build; the wheel reuses it with the Python
# target switched on. `sscbirrt` imports without the extension; backend="native" then
# reports it missing.
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
cmake.define = { SSCBIRRT_BUILD_PYTHON = "ON", SSCBIRRT_BUILD_TESTS = "OFF", SSCBIRRT_INSTALL = "OFF" }
wheel.packages = ["src/sscbirrt"]
sdist.include = ["cpp/", "src/", "tests/", "tools/", "docs/"]

# Release wheels (.github/workflows/release.yml, #153): CPython 3.10 through 3.14 on manylinux_2_28 x86_64 and
# macOS arm64, the platforms the mujoco wheel we build against covers. Inside the manylinux image there is no
# Eigen; the CMake build downloads the pinned one. libmujoco is deliberately NOT bundled: sscbirrt._native_mujoco
# links the mujoco wheel's own library through an rpath and refuses any other version, so the repair step
# excludes it on both platforms. Every built wheel is installed with the extras and runs the reference
# artifact check natively before it is kept.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux_*", "*-manylinux_i686", "*-win*", "pp*", "*linux_aarch64", "cp314t-*"]
build-verbosity = 1
test-requires = ["mujoco==3.14.0", "ssik>=7.0,<8"]
test-command = [
    "python -c \"import sscbirrt._native as n; assert n.has_ssik(), n.ssik_unavailable_reason(); from sscbirrt.backends import native_mujoco as m; assert m.available(), m.unavailable_reason(); print('wheel: ssik and mujoco native modules ok')\"",
    "python {project}/tools/reference_artifact.py --backend native --check",
    "python {project}/tools/reference_artifact.py --backend auto --check",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} --exclude libmujoco.so.3.14.0 {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
# --ignore-missing-dependencies: delocate resolves every dependency before honoring --exclude, and libmujoco
# is not present in the repair environment by design. --no-sanitize-rpaths: the module's only rpath is
# @loader_path/../mujoco, which is how it finds the mujoco wheel's library at runtime.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v --exclude libmujoco --ignore-missing-dependencies --no-sanitize-rpaths {wheel}"

[project.urls]
Homepage = "https://github.com/personalrobotics/sscbirrt"
Repository = "https://github.com/personalrobotics/sscbirrt"
Documentation = "https://github.com/personalrobotics/sscbirrt#readme"
Changelog = "https://github.com/personalrobotics/sscbirrt/blob/main/CHANGELOG.md"
Issues = "https://github.com/personalrobotics/sscbirrt/issues"

[tool.ruff]
line-length = 120
# Newer ruff formats code blocks in Markdown; keep prose examples as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/sscbirrt/__init__.py" = ["F401"]
"src/sscbirrt/**/__init__.py" = ["F401"]
